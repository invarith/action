# The action's own development tools. invarith/action isn't a package: bootstrap.py
# uses Python's standard library only, and uv runs it on a Python it provides.

[project]
name = "invarith-action"
version = "0"
requires-python = ">=3.15"

[dependency-groups]
dev = [
  "pyright[nodejs]>=1.1.414",
  "pytest>=9.2.0",
  "ruff>=0.17.4",
]

[tool.uv]
package = false
required-version = ">=0.13.7"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PT", "RUF"]

[tool.pyright]
include = ["bootstrap.py", "release_notes.py", "tests"]
typeCheckingMode = "strict"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
strict = true
